apiVersion: v1
kind: ServiceAccount
metadata:
  name: incident-assistant
  namespace: incident-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: incident-assistant
  namespace: incident-lab
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: incident-assistant
  namespace: incident-lab
subjects:
- kind: ServiceAccount
  name: incident-assistant
  namespace: incident-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: incident-assistant
